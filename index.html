<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 16px;
    color: #fff;
    background: var(--tg-theme-bg-color, #1a1a2e);
    min-height: 100vh;
    overflow: hidden;
  }
  h2 { font-size: 17px; margin-bottom: 12px; }
  audio { width: 100%; margin-bottom: 20px; }

  .timeline-wrap {
    position: relative;
    height: 48px;
    background: var(--tg-theme-hint-color, rgba(255,255,255,0.08));
    border-radius: 24px;
    margin-bottom: 16px;
    touch-action: none;
  }
  .selected {
    position: absolute;
    top: 0; height: 100%;
    background: var(--tg-theme-button-color, #4fa8ff);
    opacity: 0.35;
    border-radius: 24px;
  }
  .handle {
    position: absolute;
    top: 50%;
    width: 32px; height: 32px;
    background: var(--tg-theme-button-color, #4fa8ff);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    cursor: grab;
    z-index: 2;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .handle:active { cursor: grabbing; transform: translate(-50%,-50%) scale(1.15); }

  .times {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 20px;
    opacity: 0.85;
  }
  .times b { opacity: 1; }

  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: var(--tg-theme-button-color, #4fa8ff);
    color: var(--tg-theme-button-text-color, #fff);
    cursor: pointer;
  }
  button:active { opacity: 0.7; }
</style>
</head>
<body>
<h2>✂️ Обрезка</h2>

<audio id="player" controls preload="metadata"></audio>

<div class="timeline-wrap" id="track">
  <div class="selected" id="sel"></div>
  <div class="handle" id="h1"></div>
  <div class="handle" id="h2"></div>
</div>

<div class="times">
  <span>Начало: <b id="t1">0.0</b> с</span>
  <span>Конец: <b id="t2">0.0</b> с</span>
</div>

<button id="btn">✂️ Отправить</button>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const params = new URLSearchParams(location.search);
const duration = parseFloat(params.get('dur') || '5');
const src = params.get('src') || '';

const player = document.getElementById('player');
if (src) {
    player.src = src;
    player.onerror = () => {
        // Fallback: fetch → blob
        fetch(src).then(r => r.blob()).then(blob => {
            player.src = URL.createObjectURL(blob);
        }).catch(() => {
            player.parentElement.style.display = 'none';
            document.querySelector('h2').textContent = '✂️ Обрезка (слушайте голосовое в чате)';
        });
    };
}

const track = document.getElementById('track');
const h1 = document.getElementById('h1');
const h2 = document.getElementById('h2');
const sel = document.getElementById('sel');
const t1 = document.getElementById('t1');
const t2 = document.getElementById('t2');

let startPct = 0;   // 0..100
let endPct = 100;

function render() {
  h1.style.left = startPct + '%';
  h2.style.left = endPct + '%';
  sel.style.left = startPct + '%';
  sel.style.width = (endPct - startPct) + '%';
  t1.textContent = (startPct / 100 * duration).toFixed(1);
  t2.textContent = (endPct / 100 * duration).toFixed(1);
}

function pctFromEvent(e) {
  const rect = track.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  return Math.max(0, Math.min(100, x / rect.width * 100));
}

// --- Drag handles ---
let dragging = null; // 'h1' | 'h2'

function onPointerDown(which) {
  return function(e) {
    e.preventDefault();
    dragging = which;
  };
}

function onPointerMove(e) {
  if (!dragging) return;
  e.preventDefault();
  const pct = pctFromEvent(e);
  if (dragging === 'h1') {
    startPct = Math.min(pct, endPct - 1);
  } else {
    endPct = Math.max(pct, startPct + 1);
  }
  render();
}

function onPointerUp() {
  dragging = null;
}

h1.addEventListener('pointerdown', onPointerDown('h1'));
h2.addEventListener('pointerdown', onPointerDown('h2'));
document.addEventListener('pointermove', onPointerMove);
document.addEventListener('pointerup', onPointerUp);

// Tap on track → move nearest handle
track.addEventListener('pointerdown', function(e) {
  if (e.target === h1 || e.target === h2) return;
  const pct = pctFromEvent(e);
  const d1 = Math.abs(pct - startPct);
  const d2 = Math.abs(pct - endPct);
  if (d1 < d2) startPct = Math.min(pct, endPct - 1);
  else endPct = Math.max(pct, startPct + 1);
  render();
});

render();

document.getElementById('btn').onclick = () => {
  const a = startPct / 100 * duration;
  const b = endPct / 100 * duration;
  tg.sendData(JSON.stringify({ start: a, end: b }));
};
</script>
</body>
</html>
