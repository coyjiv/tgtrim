<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 16px;
    color: #fff;
    background: var(--tg-theme-bg-color, #1a1a2e);
    min-height: 100vh;
    overflow: hidden;
  }
  h2 { font-size: 17px; margin-bottom: 12px; }
  audio { width: 100%; margin-bottom: 16px; }

  .timeline-wrap {
    position: relative;
    height: 48px;
    background: var(--tg-theme-hint-color, rgba(255,255,255,0.08));
    border-radius: 24px;
    margin-bottom: 16px;
    touch-action: none;
  }
  .selected {
    position: absolute;
    top: 0; height: 100%;
    background: var(--tg-theme-button-color, #4fa8ff);
    opacity: 0.35;
    border-radius: 24px;
  }
  .handle {
    position: absolute;
    top: 50%;
    width: 32px; height: 32px;
    background: var(--tg-theme-button-color, #4fa8ff);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    cursor: grab;
    z-index: 2;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .handle:active { cursor: grabbing; transform: translate(-50%,-50%) scale(1.15); }

  .inputs {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .inputs label {
    flex: 1;
    font-size: 13px;
    display: block;
    margin-bottom: 4px;
    opacity: 0.8;
  }
  .inputs input {
    width: 100%;
    padding: 10px 12px;
    font-size: 18px;
    font-family: monospace;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    color: #fff;
    outline: none;
    text-align: center;
  }
  .inputs input:focus {
    border-color: var(--tg-theme-button-color, #4fa8ff);
  }

  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: var(--tg-theme-button-color, #4fa8ff);
    color: var(--tg-theme-button-text-color, #fff);
    cursor: pointer;
  }
  button:active { opacity: 0.7; }
</style>
</head>
<body>
<h2>✂️ Обрезка</h2>

<audio id="player" controls preload="metadata"></audio>

<div class="timeline-wrap" id="track">
  <div class="selected" id="sel"></div>
  <div class="handle" id="h1"></div>
  <div class="handle" id="h2"></div>
</div>

<div class="inputs">
  <div>
    <label>Начало</label>
    <input type="text" id="in1" placeholder="0:00" value="0:00">
  </div>
  <div>
    <label>Конец</label>
    <input type="text" id="in2" placeholder="0:00" value="0:00">
  </div>
</div>

<button id="btn">✂️ Отправить</button>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const params = new URLSearchParams(location.search);
const duration = parseFloat(params.get('dur') || '5');
const src = params.get('src') || '';

const player = document.getElementById('player');
if (src) {
    player.src = src;
    player.onerror = () => {
        fetch(src).then(r => r.blob()).then(blob => {
            player.src = URL.createObjectURL(blob);
        }).catch(() => { player.style.display = 'none'; });
    };
}

const track = document.getElementById('track');
const h1 = document.getElementById('h1');
const h2 = document.getElementById('h2');
const sel = document.getElementById('sel');
const in1 = document.getElementById('in1');
const in2 = document.getElementById('in2');

let startSec = 0;
let endSec = duration;

// --- Форматирование ---
function fmt(sec) {
    if (sec >= 3600) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = Math.round(sec % 60);
        return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }
    const m = Math.floor(sec / 60);
    const s = Math.round(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
}

// --- Парсинг "MM:SS" или "H:MM:SS" или "90.5" ---
function parse(str) {
    str = str.trim();
    if (!str) return NaN;
    if (str.includes(':')) {
        const parts = str.split(':').map(Number);
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        return NaN;
    }
    const v = parseFloat(str);
    return isNaN(v) ? NaN : v;
}

function render() {
    const sPct = startSec / duration * 100;
    const ePct = endSec / duration * 100;
    h1.style.left = sPct + '%';
    h2.style.left = ePct + '%';
    sel.style.left = sPct + '%';
    sel.style.width = (ePct - sPct) + '%';
    // Обновляем инпуты только если не в фокусе (чтобы не перебивать ввод)
    if (document.activeElement !== in1) in1.value = fmt(startSec);
    if (document.activeElement !== in2) in2.value = fmt(endSec);
}

function pctFromEvent(e) {
    const rect = track.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    return Math.max(0, Math.min(100, x / rect.width * 100));
}

// --- Drag ---
let dragging = null;
h1.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); dragging = 'h1'; });
h2.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); dragging = 'h2'; });

document.addEventListener('pointermove', e => {
    if (!dragging) return;
    e.preventDefault();
    const p = pctFromEvent(e);
    const sec = p / 100 * duration;
    if (dragging === 'h1') startSec = Math.min(sec, endSec - 0.1);
    else endSec = Math.max(sec, startSec + 0.1);
    render();
});
document.addEventListener('pointerup', () => dragging = null);

track.addEventListener('pointerdown', e => {
    if (e.target === h1 || e.target === h2) return;
    const sec = pctFromEvent(e) / 100 * duration;
    if (Math.abs(sec - startSec) < Math.abs(sec - endSec)) {
        startSec = Math.min(sec, endSec - 0.1);
    } else {
        endSec = Math.max(sec, startSec + 0.1);
    }
    render();
});

// --- Инпуты ---
in1.addEventListener('change', () => {
    const v = parse(in1.value);
    if (!isNaN(v)) {
        startSec = Math.max(0, Math.min(duration, v));
        if (startSec > endSec - 0.1) startSec = endSec - 0.1;
    }
    render();
});
in2.addEventListener('change', () => {
    const v = parse(in2.value);
    if (!isNaN(v)) {
        endSec = Math.max(0, Math.min(duration, v));
        if (endSec < startSec + 0.1) endSec = startSec + 0.1;
    }
    render();
});

// Enter в инпуте = отправить
[in1, in2].forEach(el => el.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn').click();
}));

render();

document.getElementById('btn').onclick = () => {
    const a = Math.max(0, startSec);
    const b = Math.min(duration, endSec);
    tg.sendData(JSON.stringify({ start: a, end: b }));
};
</script>
</body>
</html>
