<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 16px;
    color: #fff;
    background: var(--tg-theme-bg-color, #1a1a2e);
    min-height: 100vh;
    overflow: hidden;
  }
  h2 { font-size: 17px; margin-bottom: 12px; }
  audio { width: 100%; margin-bottom: 16px; }

  .timeline-wrap {
    position: relative;
    height: 48px;
    background: var(--tg-theme-hint-color, rgba(255,255,255,0.08));
    border-radius: 24px;
    margin-bottom: 16px;
    touch-action: none;
  }
  .selected {
    position: absolute;
    top: 0; height: 100%;
    background: var(--tg-theme-button-color, #4fa8ff);
    opacity: 0.35;
    border-radius: 24px;
  }
  .handle {
    position: absolute;
    top: 50%;
    width: 32px; height: 32px;
    background: var(--tg-theme-button-color, #4fa8ff);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    cursor: grab;
    z-index: 2;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .handle:active { cursor: grabbing; transform: translate(-50%,-50%) scale(1.15); }

  .inputs {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .inputs label {
    flex: 1;
    font-size: 13px;
    display: block;
    margin-bottom: 4px;
    opacity: 0.8;
  }
  .inputs input {
    width: 100%;
    padding: 10px 12px;
    font-size: 16px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    color: #fff;
    outline: none;
  }
  .inputs input:focus {
    border-color: var(--tg-theme-button-color, #4fa8ff);
  }

  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: var(--tg-theme-button-color, #4fa8ff);
    color: var(--tg-theme-button-text-color, #fff);
    cursor: pointer;
  }
  button:active { opacity: 0.7; }
</style>
</head>
<body>
<h2>✂️ Обрезка</h2>

<audio id="player" controls preload="metadata"></audio>

<div class="timeline-wrap" id="track">
  <div class="selected" id="sel"></div>
  <div class="handle" id="h1"></div>
  <div class="handle" id="h2"></div>
</div>

<div class="inputs">
  <div>
    <label>Начало (сек)</label>
    <input type="number" id="in1" min="0" step="0.1" value="0">
  </div>
  <div>
    <label>Конец (сек)</label>
    <input type="number" id="in2" min="0" step="0.1" value="0">
  </div>
</div>

<button id="btn">✂️ Отправить</button>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const params = new URLSearchParams(location.search);
const duration = parseFloat(params.get('dur') || '5');
const src = params.get('src') || '';

const player = document.getElementById('player');
if (src) {
    player.src = src;
    player.onerror = () => {
        fetch(src).then(r => r.blob()).then(blob => {
            player.src = URL.createObjectURL(blob);
        }).catch(() => { player.style.display = 'none'; });
    };
}

const track = document.getElementById('track');
const h1 = document.getElementById('h1');
const h2 = document.getElementById('h2');
const sel = document.getElementById('sel');
const in1 = document.getElementById('in1');
const in2 = document.getElementById('in2');
const btn = document.getElementById('btn');

let startSec = 0;
let endSec = duration;

in2.value = duration.toFixed(1);
in2.max = duration.toFixed(1);
in1.max = duration.toFixed(1);

function render() {
    const sPct = startSec / duration * 100;
    const ePct = endSec / duration * 100;
    h1.style.left = sPct + '%';
    h2.style.left = ePct + '%';
    sel.style.left = sPct + '%';
    sel.style.width = (ePct - sPct) + '%';
    in1.value = startSec.toFixed(1);
    in2.value = endSec.toFixed(1);
}

function setFromPct(pct) {
    const sec = pct / 100 * duration;
    return Math.max(0, Math.min(duration, sec));
}

function pctFromEvent(e) {
    const rect = track.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    return Math.max(0, Math.min(100, x / rect.width * 100));
}

// --- Drag handles ---
let dragging = null;
h1.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); dragging = 'h1'; });
h2.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); dragging = 'h2'; });

document.addEventListener('pointermove', e => {
    if (!dragging) return;
    e.preventDefault();
    const p = pctFromEvent(e);
    if (dragging === 'h1') startSec = setFromPct(p);
    else endSec = setFromPct(p);
    // Не даём пересечься (мин. зазор 0.1с)
    if (startSec > endSec - 0.1) {
        if (dragging === 'h1') startSec = endSec - 0.1;
        else endSec = startSec + 0.1;
    }
    render();
});
document.addEventListener('pointerup', () => dragging = null);

// Tap on track → nearest handle
track.addEventListener('pointerdown', e => {
    if (e.target === h1 || e.target === h2) return;
    const p = pctFromEvent(e);
    const sec = p / 100 * duration;
    if (Math.abs(sec - startSec) < Math.abs(sec - endSec)) startSec = sec;
    else endSec = sec;
    if (startSec > endSec - 0.1) {
        if (sec < (startSec + endSec) / 2) startSec = endSec - 0.1;
        else endSec = startSec + 0.1;
    }
    render();
});

// --- Numeric inputs ---
in1.addEventListener('input', () => {
    let v = parseFloat(in1.value);
    if (isNaN(v)) return;
    startSec = Math.max(0, Math.min(duration, v));
    if (startSec > endSec - 0.1) startSec = endSec - 0.1;
    render();
});
in2.addEventListener('input', () => {
    let v = parseFloat(in2.value);
    if (isNaN(v)) return;
    endSec = Math.max(0, Math.min(duration, v));
    if (endSec < startSec + 0.1) endSec = startSec + 0.1;
    render();
});

render();

btn.onclick = () => {
    const a = Math.max(0, startSec);
    const b = Math.min(duration, endSec);
    tg.sendData(JSON.stringify({ start: a, end: b }));
};
</script>
</body>
</html>
